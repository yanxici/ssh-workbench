appId: com.sshworkbench.app
productName: SSH Workbench
directories:
  buildResources: build
  output: dist-final
# ssh2 的 cpu-features 为可选加密加速（纯 JS 回退即可），跳过 native rebuild 避免依赖本机 VS
npmRebuild: false
files:
  - out/**
  - package.json
  # 运行时资源（窗口图标）。主进程 createWindow() 会读 resources/icon.png，
  # 不列进来的话它只存在于仓库里，asar 内没有 → 打包后任务栏又是白方块。
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js,DESIGN.md,README.md}'
asarUnpack:
  - resources/**
# 窗口图标额外拷一份到 resources/ 根（asar 之外）。主进程优先读这个路径：
# asar 内的路径虽然 Electron 能透明重定向，但窗口图标是在原生层加载的，
# 放外面的普通文件最稳妥。
extraResources:
  - from: resources/icon.png
    to: icon.png
  # 同一份多尺寸 ico 也给运行时用：TaskBar 在缩放比 1.25/1.5 下会自己挑尺寸，
  # 给 ico 就不用它去缩 png。
  - from: resources/icon.ico
    to: icon.ico
win:
  # 显式指定多尺寸 .ico（16/24/32/48/64/128/256，见 scripts/make-icon.cjs）。
  # 只给 build/icon.png 时，electron-builder 转出的 ico 里只有一条 256×256 的
  # PNG 记录：Windows 任务栏要 24/32px，只能让 GDI 现场缩 256 的图，缩放后
  # 白边把绿色糊掉 —— 表现就是「图标明明是绿的，任务栏却发白」。
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
# 免安装版：单个 exe，双击即用，不写注册表、不建开始菜单项
portable:
  artifactName: ${productName}-${version}-portable.${ext}
  requestExecutionLevel: user
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
  category: Development
