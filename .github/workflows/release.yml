name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build application
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 更新内容
            
            ### 新功能
            - ✨ 批量编辑标签功能
            - ✨ 会话恢复（自动保存打开的标签页）
            - ✨ 快捷键冲突检测
            - 🎨 优化安装包体积
            
            ### 改进
            - 📦 更好的批量操作体验
            - 🚀 更快的启动速度
            
            ### 下载说明
            - **安装版**: `SSH-Workbench-Setup-x.x.x.exe` - 需要管理员权限安装
            - **免安装版**: `SSH-Workbench-x.x.x.exe` - 解压即用，适合绿色便携使用
            - **解压版**: `SSH-Workbench-win32-x64-x.x.x.zip` - 完整文件夹，可自定义配置
          draft: false
          prerelease: false
      
      - name: Upload Setup Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist-electron/SSH-Workbench-Setup-${{ steps.get_version.outputs.VERSION }}.exe
          asset_name: SSH-Workbench-Setup-${{ steps.get_version.outputs.VERSION }}.exe
          asset_content_type: application/octet-stream
      
      - name: Upload Portable Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist-electron/SSH-Workbench-${{ steps.get_version.outputs.VERSION }}.exe
          asset_name: SSH-Workbench-${{ steps.get_version.outputs.VERSION }}.exe
          asset_content_type: application/octet-stream
      
      - name: Upload ZIP Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist-electron/SSH-Workbench-win32-x64-${{ steps.get_version.outputs.VERSION }}.zip
          asset_name: SSH-Workbench-win32-x64-${{ steps.get_version.outputs.VERSION }}.zip
          asset_content_type: application/zip
