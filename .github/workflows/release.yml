name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.6.4)'
        required: true
        default: 'v1.6.4'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 缓存 Electron 本体与 electron-builder 的二进制工具链。
      # setup-node 的 cache: npm 只缓存 npm 包，Electron 的 110MB 运行时和
      # winCodeSign/NSIS 每次都要重新下载 —— 历史连败里下载抖动是可疑因子。
      # 必须放在 npm ci 之前：Electron 的运行时装在 postinstall 阶段拉取。
      # key 带 Electron 版本，升级时自动失效，不会拿旧缓存配新运行时。
      - name: Resolve Electron version
        id: electron
        shell: bash
        run: |
          echo "value=$(node -p 'require("./package.json").devDependencies.electron.replace(/[^0-9.]/g,"")')" >> $GITHUB_OUTPUT

      - name: Cache Electron & builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ steps.electron.outputs.value }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-${{ steps.electron.outputs.value }}-
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      # 门禁第一步：类型检查 + 全部 verify 脚本（41 项，含 ssh2 lab server 用例）。
      # 单独成步而不是塞进 verify:prepackage：串在一个 command 里时，
      # 失败只看到整条命令红了，不知道是类型错、还是某个 verify 挂了；
      # 而且这一步不需要 Electron 窗口，比 e2e 快得多，单独失败时能少等很久。
      - name: Verify (typecheck + all unit checks)
        shell: bash
        run: |
          npm run typecheck
          npm run test:features
          npm run test:uploadfolder
          node scripts/run-all-verify.cjs

      # 门禁第二步：真起 Electron 走 CDP 的 UI 级 SFTP e2e（含上传文件夹/空目录/链接）。
      # 带超时与一次重试：历史上 3 连败都是这一步的 runner 环境抖动，
      # 一次抖动不该报废整个发布（只能删 tag 重打）。
      - name: Verify (UI e2e)
        uses: nick-fields/retry@v3
        with:
          max_attempts: 2
          retry_wait_seconds: 20
          timeout_minutes: 15
          command: npm run build && node scripts/e2e-ui-sftp.cjs

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # 门禁：tag 与 package.json 的 version 必须一致。
      # electron-builder 用 package.json 的 version 命名产物并写 latest.yml，
      # 却用 tag 决定 Release 名。两者分裂时（打了 v1.6.5 却忘了 npm version），
      # 产物叫 1.6.4-*.exe，latest.yml 写 1.6.4，客户端比对「1.6.4 <= 已装 1.6.4」
      # 判定无需更新 —— 整条自动更新链路静默失效，没有任何报错。
      - name: Assert version consistency
        shell: bash
        run: |
          TAG_VER="${{ steps.version.outputs.value }}"
          TAG_VER="${TAG_VER#v}"
          PKG_VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VER  package.json=$PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::版本不一致：tag 是 $TAG_VER，package.json 是 $PKG_VER。先跑 npm version $TAG_VER --no-git-tag-version 再打 tag。"
            exit 1
          fi

      # 发布只传 NSIS(Setup) + latest.yml；zip 仅作为排障 artifact 留着。
      # 之前 CI 用 `--win nsis zip --publish always`，而 scripts/release.ps1:83-89
      # 明确禁止上传 zip —— 同一仓库两个出口规则对不上，导致 Release 上挂了一个
      # 112.5MB 的 win.zip，与 Setup 解包内容完全一致，纯冗余。
      # 所以改成 --publish never 自己控制上传清单：zip 只进 artifact。
      - name: Build (nsis + zip, no implicit publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis zip --config electron-builder.yml --publish never

      # 只把 Setup、blockmap、latest.yml 传到 Release；zip/portable 走下面的 artifact。
      # 输出目录从 electron-builder.yml 解析，避免像 release.ps1 那样硬编码目录名后失联。
      - name: Publish release assets (nsis + latest.yml only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ steps.version.outputs.value }}" -replace '^v',''
          $tag = "v$ver"
          $m = Select-String -Path "electron-builder.yml" -Pattern '^\s*output:\s*(\S+)\s*$' -AllMatches
          if (-not $m -or $m.Matches.Count -eq 0) { Write-Host "解析不到 directories.output" -ForegroundColor Red; exit 1 }
          $dist = $m.Matches[0].Groups[1].Value.Trim('"', "'")
          $assets = @(
            (Join-Path $dist "ssh-workbench-Setup-$ver.exe"),
            (Join-Path $dist "ssh-workbench-Setup-$ver.exe.blockmap"),
            (Join-Path $dist "latest.yml")
          ) | Where-Object { Test-Path $_ }
          if ($assets.Count -lt 3) {
            Write-Host "缺少发布产物，实际找到：$($assets -join ', ')" -ForegroundColor Red
            exit 1
          }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "SSH Workbench $tag" --target main --notes "Release $tag"
          }
          gh release upload $tag @assets --clobber

      - name: Upload build artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: win-zip-${{ steps.version.outputs.value }}
          path: |
            dist-v14/*.zip
            dist-v14/*.exe
            dist-v14/latest.yml
          if-no-files-found: error
          retention-days: 7
