name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to upload to (e.g., v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --publish never：只出包，不让 electron-builder 自己去建 / 改 release
      - name: Build application
        run: npm run build:win -- --publish never

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          PKG="$(node -p "require('./package.json').version")"
          # 防止把别的版本的包传到这个 tag 上
          if [ "$TAG" != "v$PKG" ]; then
            echo "tag $TAG 与 package.json 版本 $PKG 不一致" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        shell: bash
        run: |
          V='${{ steps.v.outputs.pkg }}'
          T='${{ steps.v.outputs.tag }}'
          mkdir -p release
          cp "dist-v11/SSH Workbench Setup $V.exe"     "release/SSH-Workbench-Setup-$T.exe"
          cp "dist-v11/SSH Workbench-$V-portable.exe"  "release/SSH-Workbench-$T-portable.exe"
          cp "dist-v11/SSH Workbench-$V-win.zip"       "release/SSH-Workbench-$T-win.zip"
          ls -l release
          sha256sum release/*

      # release 已存在：只覆盖上传资产，不改标题和说明；不存在才新建
      - name: Publish to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T='${{ steps.v.outputs.tag }}'
          if gh release view "$T" > /dev/null 2>&1; then
            gh release upload "$T" release/* --clobber
          else
            gh release create "$T" release/* --title "Release $T" --generate-notes
          fi
