name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.6.4)'
        required: true
        default: 'v1.6.4'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 门禁：类型检查 + 功能自检 + 真·UI 级 SFTP 端到端（含上传文件夹/空目录/链接）
      # 任何一项不过就不出包 —— 1.6.3 就是「测试全绿但功能坏了」的教训。
      - name: Verify (typecheck + features + UI e2e)
        run: npm run verify:prepackage

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      # electron-builder 直接发布：zip + latest.yml（自动更新要的清单）都在这里生成
      - name: Build & publish (zip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win zip --config electron-builder.yml --publish always

      - name: Upload build artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: win-zip-${{ steps.version.outputs.value }}
          path: dist-v14/*.zip
          if-no-files-found: error
          retention-days: 7
